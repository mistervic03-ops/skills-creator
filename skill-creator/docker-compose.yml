services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      SKILL_LIBRARY_DIR: /app/data/skills
    volumes:
      - skill-library-data:/app/data
    expose:
      - "8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  skill-library-data:
